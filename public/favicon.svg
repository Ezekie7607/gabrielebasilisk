<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#08080a"/>
  <!-- pixel basilisk eye: stone ring, bone iris, dark pupil -->
  <rect x="5" y="1" width="6" height="1" fill="#8c887e"/>
  <rect x="3" y="2" width="2" height="1" fill="#8c887e"/>
  <rect x="11" y="2" width="2" height="1" fill="#8c887e"/>
  <rect x="2" y="3" width="1" height="2" fill="#8c887e"/>
  <rect x="13" y="3" width="1" height="2" fill="#8c887e"/>
  <rect x="1" y="5" width="1" height="6" fill="#8c887e"/>
  <rect x="14" y="5" width="1" height="6" fill="#8c887e"/>
  <rect x="2" y="11" width="1" height="2" fill="#8c887e"/>
  <rect x="13" y="11" width="1" height="2" fill="#8c887e"/>
  <rect x="3" y="13" width="2" height="1" fill="#8c887e"/>
  <rect x="11" y="13" width="2" height="1" fill="#8c887e"/>
  <rect x="5" y="14" width="6" height="1" fill="#8c887e"/>
  <!-- bone sclera / mosaic -->
  <rect x="5" y="2" width="6" height="1" fill="#f3efe6"/>
  <rect x="3" y="3" width="10" height="2" fill="#f3efe6"/>
  <rect x="2" y="5" width="12" height="6" fill="#f3efe6"/>
  <rect x="3" y="11" width="10" height="2" fill="#f3efe6"/>
  <rect x="5" y="13" width="6" height="1" fill="#f3efe6"/>
  <!-- stone inner ring -->
  <rect x="6" y="4" width="4" height="1" fill="#8c887e"/>
  <rect x="4" y="5" width="2" height="1" fill="#8c887e"/>
  <rect x="10" y="5" width="2" height="1" fill="#8c887e"/>
  <rect x="4" y="6" width="1" height="4" fill="#8c887e"/>
  <rect x="11" y="6" width="1" height="4" fill="#8c887e"/>
  <rect x="4" y="10" width="2" height="1" fill="#8c887e"/>
  <rect x="10" y="10" width="2" height="1" fill="#8c887e"/>
  <rect x="6" y="11" width="4" height="1" fill="#8c887e"/>
  <!-- dark pupil -->
  <rect x="6" y="6" width="4" height="4" fill="#08080a"/>
  <rect x="7" y="5" width="2" height="1" fill="#08080a"/>
  <rect x="7" y="10" width="2" height="1" fill="#08080a"/>
  <rect x="5" y="7" width="1" height="2" fill="#08080a"/>
  <rect x="10" y="7" width="1" height="2" fill="#08080a"/>
  <!-- bone glint -->
  <rect x="7" y="7" width="1" height="1" fill="#f3efe6"/>
</svg>
